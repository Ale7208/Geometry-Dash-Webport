name: Feature request
description: Request a new feature or functionality that does not exist in the game yet.
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to suggest a completely new feature or functionality that the game does not currently have. If you want to improve something that already exists, use Enhancement request instead.
        
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: idea
    attributes:
      label: What new feature would you like to add?
      description: Describe your idea and how you imagine it working.
      placeholder: Explain your idea...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: usefulness
    attributes:
      label: Why would this feature be useful?
      description: Explain what problem it would solve or how it would improve the game.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: examples
    attributes:
      label: Examples or references
      description: Optional. Add links or attach screenshots that help explain your idea.
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: alternatives
    attributes:
      label: Other suggestions
      description: Optional. Mention any alternative solutions or extra details.
    validations:
      required: false
