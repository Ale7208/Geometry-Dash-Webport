name: Crash report
description: Report a crash, freeze, or unexpected game shutdown.
labels: ["crash"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the game closes unexpectedly, freezes, or stops responding. Please include the exact error message. If no message appeared, write "No error message was displayed".
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: what-happened
    attributes:
      label: What happened before the crash?
      description: Explain what you were doing immediately before the game crashed or stopped responding.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: error-message
    attributes:
      label: Error message
      description: Required. Copy the exact message shown by the game or browser. If no message appeared, write "No error message was displayed".
      placeholder: Paste the full error message here, or write "No error message was displayed".
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      description: Select the browser you used.
      options:
        - Google Chrome
        - Microsoft Edge
        - Mozilla Firefox
        - Safari
        - Other
        - I don't know
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: dropdown
    id: device
    attributes:
      label: Device
      description: Select the device you were playing on.
      options:
        - Windows PC
        - Mac
        - Chromebook
        - Android phone or tablet
        - iPhone or iPad
        - Other
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: dropdown
    id: playing-location
    attributes:
      label: Where were you playing?
      description: Choose how you opened the game.
      options:
        - Official website
        - Downloaded HTML file
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: dropdown
    id: crash-stage
    attributes:
      label: When did the crash happen?
      description: Optional. Select the closest match.
      options:
        - While loading
        - In the main menu
        - While playing a level
        - While opening a level
        - While completing a level
        - While saving or loading progress
        - Other / Not sure
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: console-errors
    attributes:
      label: Additional console errors
      description: Optional. If possible, copy any related errors from the browser console (F12 > Console).
      render: text
    validations:
      required: false
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: media
    attributes:
      label: Screenshot or video
      description: Optional. Attach an image or short recording if it helps show the crash.
    validations:
      required: false
