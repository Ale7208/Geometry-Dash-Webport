name: Enhancement request
description: Request an improvement or change to a feature or functionality that already exists.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request an improvement, adjustment, or change to something that already exists in the game. If you want to suggest a completely new feature or functionality, use Feature request instead.

        Check existing issues first to see whether someone has already suggested the same improvement.
  - type: markdown
    attributes:
      value: |
        ---
  - type: input
    id: target
    attributes:
      label: What would you like to improve?
      description: Identify the existing feature, screen, control, or part of the game.
      placeholder: e.g. The level loading screen
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: current
    attributes:
      label: How does it work currently?
      description: Explain how the feature works now or what could be better.
      placeholder: Describe the current behavior...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: improvement
    attributes:
      label: What change would you like to see?
      description: Describe the improvement you are proposing.
      placeholder: Explain how you would improve it...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: benefit
    attributes:
      label: Why would this improvement be useful?
      description: Explain how it would make the experience better for players.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ---
  - type: textarea
    id: references
    attributes:
      label: Examples or references
      description: Optional. Add links or attach screenshots that help explain your suggestion.
    validations:
      required: false
