name: JavaScript syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    name: Check JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check JavaScript files and inline scripts
        run: |
          python3 <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import sys
          import tempfile

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.capture = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag != "script":
                      return
                  attrs = dict(attrs)
                  script_type = attrs.get("type", "").split(";")[0].strip().lower()
                  is_javascript = script_type in ("", "module", "text/javascript", "application/javascript")
                  self.capture = is_javascript and "src" not in attrs
                  if self.capture:
                      self.parts = []

              def handle_data(self, data):
                  if self.capture:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.capture:
                      code = "".join(self.parts)
                      if code.strip():
                          self.scripts.append(code)
                      self.capture = False
                      self.parts = []

          checked = 0

          # Check standalone JavaScript files in the repository.
          for path in sorted(Path(".").rglob("*.js")):
              if any(part in ("node_modules", ".git") for part in path.parts):
                  continue
              result = subprocess.run(["node", "--check", str(path)], text=True, capture_output=True)
              if result.returncode:
                  print(f"Syntax error in {path}:")
                  print(result.stderr)
                  sys.exit(result.returncode)
              print(f"OK: {path}")
              checked += 1

          # Extract and check executable inline scripts from index.html.
          html_path = Path("index.html")
          if not html_path.is_file():
              print("Missing index.html")
              sys.exit(1)

          parser = ScriptExtractor()
          parser.feed(html_path.read_text(encoding="utf-8"))
          for number, code in enumerate(parser.scripts, start=1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as temp:
                  temp.write(code)
                  temp_path = temp.name
              result = subprocess.run(["node", "--check", temp_path], text=True, capture_output=True)
              Path(temp_path).unlink(missing_ok=True)
              if result.returncode:
                  print(f"Syntax error in inline script #{number} in index.html:")
                  print(result.stderr)
                  sys.exit(result.returncode)
              print(f"OK: inline script #{number} in index.html")
              checked += 1

          print(f"JavaScript syntax check passed ({checked} checks).")
          PY
