name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            🎉 Congratulations on opening your first issue!

            Thank you for taking the time to report an issue. Your feedback helps the developer identify problems, understand their impact, and work towards possible solutions.

            We appreciate your contribution to Geometry Dash Webport!
          pr-message: |
            🎉 Congratulations on opening your first pull request!

            Thank you for contributing to Geometry Dash Webport. Your effort and proposed changes help improve the project.

            The developer will review your contribution as soon as possible. We appreciate your support!
