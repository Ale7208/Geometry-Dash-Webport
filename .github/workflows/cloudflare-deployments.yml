name: Sync Cloudflare Pages deployments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_run:
    workflows:
      - Pages build and deployment
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  actions: read

concurrency:
  group: cloudflare-pages-deployments
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Publish successful Cloudflare Pages deployments to GitHub
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a repository secret and CLOUDFLARE_ACCOUNT_ID as a repository variable."
            exit 1
          fi

          CF_API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/gd-webport/deployments?per_page=10"
          response="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${CF_API}")"

          echo "${response}" | jq -e '.success == true' >/dev/null

          count="$(echo "${response}" | jq '.result | length')"
          if [ "${count}" -eq 0 ]; then
            echo "No Cloudflare Pages deployments found."
            exit 0
          fi

          echo "${response}" | jq -c '.result[]' | while read -r deployment; do
            stage="$(echo "${deployment}" | jq -r '.latest_stage.status // empty')"
            if [ "${stage}" != "success" ]; then
              continue
            fi

            deployment_id="$(echo "${deployment}" | jq -r '.id')"
            commit_sha="$(echo "${deployment}" | jq -r '.deployment_trigger.metadata.commit_hash // empty')"
            environment="$(echo "${deployment}" | jq -r '.environment // "production"')"
            deployment_url="$(echo "${deployment}" | jq -r '.aliases[0] // empty')"
            if [ -z "${deployment_url}" ]; then
              deployment_url="$(echo "${deployment}" | jq -r '.url // empty')"
            fi

            if [ -z "${commit_sha}" ] || [ "${commit_sha}" = "null" ]; then
              echo "Skipping ${deployment_id}: Cloudflare did not provide a commit SHA."
              continue
            fi

            description="Cloudflare Pages deployment ID: ${deployment_id}"
            existing="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments?environment=${environment}&per_page=100")"

            if echo "${existing}" | jq -e --arg d "${description}" 'any(.[]; .description == $d)' >/dev/null; then
              echo "Already recorded: ${deployment_id}"
              continue
            fi

            created="$(curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments" \
              -d "$(jq -n --arg ref "${commit_sha}" --arg env "${environment}" --arg desc "${description}" \
                '{ref:$ref, environment:$env, description:$desc, auto_merge:false, required_contexts:[]}')")"

            github_deployment_id="$(echo "${created}" | jq -r '.id')"
            if [ -z "${github_deployment_id}" ] || [ "${github_deployment_id}" = "null" ]; then
              echo "::error::GitHub did not return a deployment ID for Cloudflare deployment ${deployment_id}."
              echo "${created}"
              exit 1
            fi

            status_payload="$(jq -n --arg state "success" --arg url "${deployment_url}" \
              --arg desc "Successfully deployed by Cloudflare Pages (deployment ${deployment_id})." \
              '{state:$state, description:$desc, environment_url:$url, log_url:$url}')"

            curl --fail-with-body --silent --show-error -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/deployments/${github_deployment_id}/statuses" \
              -d "${status_payload}" >/dev/null

            echo "Published GitHub deployment for Cloudflare deployment ${deployment_id}."
          done
